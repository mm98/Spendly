name: CI

# Every commit on main arrives by squash-merging a PR, so a push-to-main run of this same
# workflow re-checks a tree the PR's own run already checked -- same code, same result, paid
# for twice, Lighthouse's ~90s included. The one thing it would catch -- a push that skipped
# review -- isn't a path this repo uses; if that ever changes, add `push: branches: [main]`
# back. docker.yml's own main-triggered build (and its Lighthouse run against the shipped
# image) is unrelated and keeps running regardless -- it measures the artifact, not the diff.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run icons:check
      - run: npm run icons:brand:check

  # Every SQL statement the API runs, against the plan SQLite picks for it, compared to the
  # blessed baseline -- so a query added or edited here arrives with its plan reviewed, and an
  # index arrives with its write cost counted. Its own job: it needs api/'s dependencies, not
  # react/'s, and a red plan check should read as a red plan check rather than a failed build.
  queries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run queries:check

  # CLAUDE.md's Comments rule, made mechanical and scoped to the diff -- a comment nobody
  # touched never fails a run it has nothing to do with, the same shape as queries: above.
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-comments.mjs
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # Lighthouse against the built bundle served by the API process -- the deployed shape, not
  # the dev server, which serves unminified modules one file per import and scores something
  # nobody ships. Accessibility and best practices hold a floor (rule checks, same answer on
  # any machine); SEO is not measured at all -- a sign-in-gated ledger has no crawler to rank
  # it; performance is printed and never gated, because a stopwatch on a shared runner fails
  # for reasons a change did not cause.
  #
  # Runs on every push and pull request now, not main only: the script itself (registering an
  # account, filling it with demo data, driving Chrome through puppeteer-core) has moved parts
  # that a push-to-main-only gate never exercises before landing, and a break in it -- the kind
  # #173 shipped, caught only after merge -- is exactly what a PR run is for. The floor is what
  # still matters on every commit; the score itself stays a number to read, not a merge blocker.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
        working-directory: react
      - run: npm run build
        working-directory: react
      - run: npm ci --omit=dev
        working-directory: api
      # --no-save: Lighthouse is a hundred megabytes of CI-only tool, and adding it to
      # react/package.json would make every other job install it to run neither.
      - run: npm i --no-save lighthouse
        working-directory: react
      - name: Serve the build
        run: |
          SPENDLY_DB="$RUNNER_TEMP/lighthouse.sqlite3" PORT=4000 node api/src/server.js &
          for i in $(seq 1 60); do curl -sf localhost:4000/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:4000/ >/dev/null || { echo 'the build is not being served'; exit 1; }
      - run: node scripts/lighthouse.mjs http://localhost:4000/
        working-directory: react
