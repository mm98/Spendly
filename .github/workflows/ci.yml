name: CI

# Runs once, when a change lands on main, and docker.yml waits for it: what decides whether an
# image is built and pulled by the NAS is the commit that actually ships. A pull request is
# not checked before it is merged. It runs only for what is built into the image or read by a
# check, so docker.yml, which follows it, builds an image only when something in it changed.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'react/**'
      - 'scripts/**'
      - 'storybook/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docker.yml'

# The checks only read the code, so the run's token can do nothing else.
permissions:
  contents: read

jobs:
  # One job, not one per check: every job is billed as at least a whole minute, and each check
  # takes seconds. A check runs even when one before it failed, so one run names every failure.
  checks:
    runs-on: ubuntu-latest
    # Sized to catch a hang and nothing else: GitHub's own default is six hours, long enough
    # for a stuck step to hold a runner most of a day, and a slow platform day is not a failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # the comment check diffs against the main this push landed on
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            react/package-lock.json
            api/package-lock.json
            storybook/package-lock.json

      # Every control that opens a new browsing context carries rel="noopener". Whole tree, not
      # the diff: one that lands without it is wrong every day after.
      - name: External links
        run: node scripts/check-external-links.mjs

      # CLAUDE.md's Comments rule, scoped to the diff: a comment nobody touched never fails a run.
      - name: Comments
        if: ${{ !cancelled() }}
        run: node scripts/check-comments.mjs
        env:
          # github.event.before is the main this push landed on, so the diff is what the merge
          # actually brought in.
          CHECK_BASE_SHA: ${{ github.event.before }}

      - name: Install the app
        if: ${{ !cancelled() }}
        working-directory: react
        run: npm ci
      - name: Audit the app's packages
        if: ${{ !cancelled() }}
        working-directory: react
        run: npm audit --audit-level=high
      - name: Build
        if: ${{ !cancelled() }}
        working-directory: react
        run: npm run build
      - name: Bank statements
        if: ${{ !cancelled() }}
        working-directory: react
        run: npm run bank:check
      - name: Design rules
        if: ${{ !cancelled() }}
        working-directory: react
        run: npm run design:check
      - name: Icons
        if: ${{ !cancelled() }}
        working-directory: react
        run: npm run icons:check

      # Storybook draws the app's components, so a change to a component is checked against it here.
      # It uses the app's packages installed above.
      - name: Install Storybook
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npm ci
      - name: Audit Storybook's packages
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npm audit --audit-level=high
      - name: Every component has a story
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npm run check
      # The components are Claude Design's code, and the pages give each one the kind of value its
      # type comment asks for. Both write what differs to the run's summary.
      - name: Components are as Claude Design has them
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npm run design:check
      - name: Pages give the components the right kind of value
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npm run props:check
      # the stats file lets Chromatic take new pictures only of the stories a change reaches
      - name: Storybook builds
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npm run build -- --stats-json
      - name: Install the browser the stories are tested in
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npx playwright install --with-deps --only-shell chromium
      # Every story renders, runs its play steps and its accessibility check, and logs no error.
      - name: Every story passes its tests
        if: ${{ !cancelled() }}
        working-directory: storybook
        run: npm test
      # Pictures of the changed stories and pages, compared on chromatic.com against the last
      # approved ones. The step ends once they are sent: Chromatic puts its result on the commit.
      # It reports and never fails the run: the change is on main already, and is approved there.
      - name: Pictures of the stories
        if: ${{ !cancelled() }}
        working-directory: storybook
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then echo "No Chromatic token: skipped"; exit 0; fi
          npx chromatic --storybook-build-dir dist --only-changed --exit-zero-on-changes --exit-once-uploaded --diagnostics-file || true
          node scripts/chromatic-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Install the API
        if: ${{ !cancelled() }}
        working-directory: api
        # the language model's runtime fetches GPU extras on install; the plans need none of it
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Audit the server's packages
        if: ${{ !cancelled() }}
        working-directory: api
        run: npm audit --audit-level=high
      # Every SQL statement the API runs, against the plan SQLite picks for it, compared to the
      # blessed baseline, so a query added or edited arrives with its plan reviewed.
      - name: Query plans
        if: ${{ !cancelled() }}
        working-directory: api
        run: npm run queries:check
      - name: Server tests
        if: ${{ !cancelled() }}
        working-directory: api
        run: npm test

  # Lighthouse against the built bundle served by the API process -- the deployed shape, not
  # the dev server, which serves unminified modules one file per import and scores something
  # nobody ships. Accessibility and best practices hold a floor (rule checks, same answer on
  # any machine); SEO is not measured at all -- a sign-in-gated ledger has no crawler to rank
  # it; performance is printed and never gated, because a stopwatch on a shared runner fails
  # for reasons a change did not cause.
  #
  # Runs on every push to main: the script itself (registering an
  # account, filling it with demo data, driving Chrome through puppeteer-core) has moved parts
  # that a push-to-main-only gate never exercises before landing, and a break in it -- the kind
  # #173 shipped, caught only after merge -- is exactly what a PR run is for. The floor is what
  # still matters on every commit; the score itself stays a number to read, not a merge blocker.
  lighthouse:
    # switched off: nothing in the app shows the score
    if: false
    runs-on: ubuntu-latest
    # Three installs and a Chrome run, so this one is the long job on the board, not a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
        working-directory: react
      - run: npm run build
        working-directory: react
      - run: npm ci --omit=dev
        working-directory: api
      # --no-save: Lighthouse is a hundred megabytes of CI-only tool, and adding it to
      # react/package.json would make every other job install it to run neither.
      - run: npm i --no-save lighthouse
        working-directory: react
      - name: Serve the build
        run: |
          SPENDLY_DB="$RUNNER_TEMP/lighthouse.sqlite3" PORT=4000 node api/src/server.js &
          for i in $(seq 1 60); do curl -sf localhost:4000/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:4000/ >/dev/null || { echo 'the build is not being served'; exit 1; }
      - run: node scripts/lighthouse.mjs http://localhost:4000/
        working-directory: react
