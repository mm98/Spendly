name: Docker

# Builds the deploy image and publishes it to GHCR, so a self-hosted box (the QNAP)
# pulls a ready image instead of compiling better-sqlite3 on NAS hardware.
#
# It waits for CI rather than running beside it: on a push both start at once, so an image
# could be built, measured, pushed and pulled by the NAS while the run that would have failed
# was still going. What ships is a commit every check agreed on.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    # Nothing ships from a CI run that failed or was cancelled. A hand-started run has no CI
    # run behind it to read, and is the deliberate way to rebuild the current main.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # github.sha is the default branch's head under workflow_run, not the commit CI ran on,
      # and checkout defaults to the same. Both would silently build something else the moment
      # a second merge lands while this one is building.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build stamp the image bakes into /api/version (Dockerfile ARGs), so the running
      # container can say which commit it is and when it was built.
      - name: Build stamp
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Two passes over one build. The first produces the
      # image locally; Lighthouse scores that container -- the actual artifact, serving its own
      # bundle through its own API, which is the only honest thing to stamp -- and the second
      # pass bakes the result in. Every layer is cached from the first pass, so the second
      # rebuilds the ENV line and nothing else.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: spendly:measuring
          build-args: |
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            GIT_SHA=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Score the image
        id: lighthouse
        run: |
          # SPENDLY_DB into /tmp: the image points it at /data, which only exists once a volume
          # is mounted over it, and this container is thrown away after the measurement.
          docker run -d --name spendly-measuring -p 4000:4000 -e SPENDLY_DB=/tmp/lh.sqlite3 spendly:measuring
          for i in $(seq 1 60); do curl -sf localhost:4000/api/health >/dev/null && break; sleep 0.5; done
          npm i --no-save lighthouse --prefix react
          node react/scripts/lighthouse.mjs http://localhost:4000/ --out=lighthouse.json
          echo "scores=$(cat lighthouse.json)" >> "$GITHUB_OUTPUT"
          docker rm -f spendly-measuring
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spendly:latest
            ghcr.io/${{ github.repository_owner }}/spendly:${{ env.SHA }}
          build-args: |
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            GIT_SHA=${{ env.SHA }}
            LIGHTHOUSE=${{ steps.lighthouse.outputs.scores }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One push, one package version. With the default provenance attestation, buildx
          # pushes an index plus an unreferenced-by-tag attestation manifest, and GHCR lists
          # that second manifest as its own untagged version -- so "keep the 10 most recent
          # versions" below would mean five builds, not ten, and half of what it kept would
          # be attestations. Off, the `latest` and `<sha>` tags are two tags on one version.
          provenance: false

  # Every push to main adds a `<sha>` tag, and nothing has ever removed one, so the package
  # grows without bound on a registry whose storage is the repository's. Keep the ten most
  # recent versions and delete the rest; `latest` always shares a digest with the newest
  # `<sha>`, so it is inside the kept set by construction and cannot be pruned out from
  # under a `docker compose pull`.
  prune:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: spendly
          package-type: container
          min-versions-to-keep: 5
