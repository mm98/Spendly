name: Docker

# Builds the deploy image and publishes it to GHCR, so a self-hosted box (the QNAP)
# pulls a ready image instead of compiling better-sqlite3 on NAS hardware.
# Pull requests build without pushing, which is what verifies the Dockerfile in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build stamp the image bakes into /api/version (Dockerfile ARGs), so the running
      # container can say which commit it is and when it was built.
      - name: Build stamp
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/spendly:latest
            ghcr.io/${{ github.repository_owner }}/spendly:${{ github.sha }}
          build-args: |
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
