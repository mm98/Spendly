name: Pages

# Run by hand, from Actions -> Pages -> Run workflow. Nothing here fires on a push, a release
# or a schedule: publishing puts the app on the open web at the Pages URL, so it happens when
# someone decides it happens, and the run log says who pressed it and on what.
#
# One thing has to be true outside this file before it can work: the repository's Pages source
# must be set to GitHub Actions rather than a branch (Settings -> Pages), which is what lets a
# workflow deploy at all -- deploy-pages fails against a branch source. Pages on a private
# repository is a paid feature besides, which this repository is not affected by.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to publish
        default: main

# `pages: write` and `id-token: write` are what deploy-pages needs; nothing here writes to the
# repository, so contents stays read.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci

      # The same four checks CI runs on a pull request, in the same order, so a hand-run
      # publish cannot ship something a PR would have been red for.
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run icons:check
      - run: npm run icons:brand:check

      # The path is the workspace's, not the job's: `defaults.run` sets the directory for `run`
      # steps and an action's inputs are not one.
      #
      # dist goes up whole, .gz and .br variants included. Pages compresses on the fly and has
      # no gzip_static of its own, so those files are carried and not served -- they cost about
      # a second of upload and they are what makes the same bundle correct on a server that
      # does read them. README (react): the host's half of the compression.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: echo "Published ${{ inputs.ref }} to ${{ steps.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
