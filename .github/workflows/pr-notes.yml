name: PR notes

# Its own workflow, not a CI job: it has to run again when only the body is edited, and CI
# should not rebuild everything for a changed sentence.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-pr-notes.mjs
