name: Version labels

# The "major" or "minor" label on a pull request puts "[major]" or "[minor]" in its title, and taking
# the label off takes it out again. The title is what scripts/version.mjs reads once the change is merged.

on:
  pull_request:
    types: [labeled, unlabeled]

jobs:
  title:
    # any other label is skipped here, so it never starts a runner
    if: github.event.label.name == 'major' || github.event.label.name == 'minor'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Match the title to the labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          # the labels after this change; major wins when both are on
          MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'major') }}
          MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}
        run: |
          bare=$(printf '%s' "$TITLE" | sed -E 's/[[:space:]]*\[(major|minor)\][[:space:]]*/ /Ig; s/^ +| +$//g')
          if [ "$MAJOR" = true ]; then title="[major] $bare"
          elif [ "$MINOR" = true ]; then title="[minor] $bare"
          else title="$bare"; fi
          if [ "$title" != "$TITLE" ]; then gh pr edit "$NUMBER" --title "$title"; fi
