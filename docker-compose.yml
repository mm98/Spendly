# Spendly for a home server (written for QNAP Container Station, works anywhere Docker does).
# The bind mount is the database: back that folder up and you have backed the app up.

services:
  spendly:
    # Build locally, or swap these two lines for the CI-built image from GHCR
    # (docker login ghcr.io first if the repo is private):
    image: ghcr.io/mm98/spendly:latest
    #   build: .
    # A local build stamps no build time or commit into Settings > This build unless told:
    #   docker compose build --build-arg BUILD_TIME=$(date -u +%FT%TZ) --build-arg GIT_SHA=$(git rev-parse HEAD)
    container_name: spendly
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      SPENDLY_DB: /data/spendly.sqlite3
      # Sessions over plain http (LAN access by IP). Remove this line if you put the app
      # behind HTTPS (reverse proxy, Tailscale serve), so the cookie goes back to Secure.
      SPENDLY_PLAIN_HTTP: "1"
      # The bundle ships a source map beside every chunk, so a stack trace off this container
      # names a file in src/ rather than index-<hash>.js:1:24817. They are in the image either
      # way and cost no page load -- a browser fetches one only with devtools open -- but while
      # they are served, anyone who can reach this app can read its sources. Uncomment to hand
      # them out; it is a serving decision, so it takes a restart and not a rebuild:
      # SPENDLY_SOURCE_MAPS: "1"
      # Lets Scan actually read a dropped receipt (vendor, date, line items, totals) instead of
      # only storing it for you to fill in by hand. Scan works either way, just without the
      # reading. Enabled by default against the bundled `ollama` service below -- fully local, no
      # per-scan cost, nothing to install yourself. First start still needs the ollama-pull
      # service (below) to finish downloading the model (a few GB) before reads actually work;
      # until then, and on any other failure, a scan read just falls back to the same blank draft
      # as having no provider configured at all -- nothing here blocks Spendly itself starting.
      OLLAMA_MODEL: qwen2.5vl:7b
      OLLAMA_HOST: http://ollama:11434
      # To point at Ollama running somewhere else instead (already-installed on this host, a NAS,
      # another machine) rather than the bundled container: comment out the ollama and
      # ollama-pull services below, keep OLLAMA_MODEL, and change OLLAMA_HOST to that host's
      # address -- from inside this container "localhost" means this container, not your host, so
      # a same-machine Ollama needs host.docker.internal:11434 (11434 is Ollama's own default
      # port), which needs the commented extra_hosts entry below to resolve on plain Linux Docker
      # Engine (Docker Desktop on Mac/Windows resolves it already).
      # OLLAMA_HOST: http://host.docker.internal:11434
      #
      # Or use Anthropic's cloud API instead of Ollama entirely (reads PDFs as well as images,
      # costs per scan) -- get a key at https://console.anthropic.com/. Both can be set at once;
      # OLLAMA_MODEL wins unless SCAN_AI_PROVIDER names one explicitly.
      # ANTHROPIC_API_KEY: sk-ant-...
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    volumes:
      # Absolute path, deliberately -- a relative one (./data) resolves against wherever this
      # file itself happens to sit, so moving or re-fetching docker-compose.yaml silently points
      # the app at a fresh, empty directory instead of the real data. An absolute path can't drift
      # like that. On QNAP, prefer an absolute path on a real share the same way, e.g.
      # /share/Container/spendly:/data
      - /spendly:/data

  # The vision model Scan reads receipts with, bundled so `docker compose up` needs nothing
  # installed on the host. CPU-only by default -- works, but a multi-second-per-scan read is
  # normal without a GPU. For an NVIDIA GPU (needs the NVIDIA Container Toolkit on the host),
  # uncomment the deploy block below.
  ollama:
    image: ollama/ollama:latest
    container_name: spendly-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Runs once, pulls the model named by spendly's OLLAMA_MODEL into the ollama service above, and
  # exits -- Scan's reads work as soon as this finishes (a few GB, so first start is the slow
  # one). Safe to leave running on every `docker compose up`: `ollama pull` is a no-op once the
  # model is already there.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: spendly-ollama-pull
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen2.5vl:7b"]
    restart: "no"

volumes:
  ollama_data:
