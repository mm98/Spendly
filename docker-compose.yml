# Spendly for a home server (written for QNAP Container Station, works anywhere Docker does).
# The bind mount is the database: back that folder up and you have backed the app up.

services:
  spendly:
    # Build locally, or swap these two lines for the CI-built image from GHCR
    # (docker login ghcr.io first if the repo is private):
    image: ghcr.io/mm98/spendly:latest
    #   build: .
    # A local build stamps no build time or commit into Settings > This build unless told:
    #   docker compose build --build-arg BUILD_TIME=$(date -u +%FT%TZ) --build-arg GIT_SHA=$(git rev-parse HEAD)
    container_name: spendly
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      SPENDLY_DB: /data/spendly.sqlite3
      # Sessions over plain http (LAN access by IP). Remove this line if you put the app
      # behind HTTPS (reverse proxy, Tailscale serve), so the cookie goes back to Secure.
      SPENDLY_PLAIN_HTTP: "1"
      # The bundle ships a source map beside every chunk, so a stack trace off this container
      # names a file in src/ rather than index-<hash>.js:1:24817. They are in the image either
      # way and cost no page load -- a browser fetches one only with devtools open -- but while
      # they are served, anyone who can reach this app can read its sources. Uncomment to hand
      # them out; it is a serving decision, so it takes a restart and not a rebuild:
      # SPENDLY_SOURCE_MAPS: "1"
      # Optional: lets Scan actually read a dropped receipt (vendor, date, line items, totals)
      # instead of only storing it for you to fill in by hand. Scan works either way, just
      # without the reading. Two ways to enable it, and only one is needed:
      #  - Anthropic (cloud, reads PDFs and images): get a key at https://console.anthropic.com/
      # ANTHROPIC_API_KEY: sk-ant-...
      #  - Ollama (fully local, images only): point at a vision model served by `ollama serve`.
      #    11434 is Ollama's own default port. "localhost" from inside this container is this
      #    container, not your host -- if Ollama runs on the host machine (the common case), use
      #    host.docker.internal instead, which the extra_hosts entry below makes resolvable here.
      #    If Ollama runs as its own container on this same compose network, use its service name
      #    instead of host.docker.internal (e.g. http://ollama:11434) and drop extra_hosts.
      # OLLAMA_MODEL: qwen2.5vl:7b
      # OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      # Makes host.docker.internal resolve on plain Linux Docker Engine (Docker Desktop on
      # Mac/Windows already resolves it without this). Harmless to leave in when OLLAMA_HOST is
      # unused -- it is just a hosts-file entry, not a running connection.
      - "host.docker.internal:host-gateway"
    volumes:
      # On QNAP, prefer an absolute path on a real share, e.g. /share/Container/spendly:/data
      - ./data:/data
