# Spendly for a home server (written for QNAP Container Station, works anywhere Docker does).
# The /data bind mount is the database: back that folder up and you have backed the app up.
# The /storage bind mount holds the files Ask makes. They are kept for 30 days and need no backup.
# The /logs bind mount holds a copy of the container log, one file a day, kept for 30 days.

services:
  spendly:
    # Build locally, or swap these two lines for the CI-built image from GHCR
    # (docker login ghcr.io first if the repo is private):
    image: ghcr.io/mm98/spendly:latest
    #   build: .
    # Local build: stamp a build time and commit into Settings > This build:
    #   docker compose build --build-arg BUILD_TIME=$(date -u +%FT%TZ) --build-arg GIT_SHA=$(git rev-parse HEAD)
    container_name: spendly
    restart: unless-stopped
    ports:
      # Plain http on the home network, for a device that does not trust caddy's certificate
      # (an iPhone home-screen app). Delete this ports block to allow HTTPS only.
      - "4000:4000"
    environment:
      SPENDLY_DB: /data/spendly.sqlite3
      # Files kept outside the database, one folder for each account. Not part of the backup.
      SPENDLY_STORAGE: /storage
      # A copy of the container log, one file a day, kept for 30 days. Delete this line to keep no copy.
      SPENDLY_LOGS: /logs
      # Without this the container's clock is UTC, so the nightly backup fires at UTC
      # 23:59:59 -- 1-2am local, depending on daylight saving -- not local midnight.
      TZ: "Europe/Copenhagen"
      # Keeps HSTS off, so the plain http address on port 4000 keeps working. Remove together
      # with the port above when every device trusts caddy's certificate.
      SPENDLY_PLAIN_HTTP: "1"
      # Optional: lets Scan read receipts automatically. Get a key at console.anthropic.com.
      # ANTHROPIC_API_KEY: sk-ant-...
      # Optional: how Scan sends a PDF to be read. "text" (the default) sends only the words in it
      # and costs the least. "pictures" sends a picture of each page, like a photo. "document" sends
      # the whole file and costs the most. Text and pictures read the first 5 pages only. A scanned
      # PDF, or one whose words come out broken or too few, is always sent as pictures.
      # SPENDLY_PDF_READING: text
      # Optional: how many questions each account can ask on Ask each day. Every question is paid
      # on the key above. 0 turns Ask off.
      # SPENDLY_ASK_QUESTIONS_PER_DAY: 25
      # Which Claude model answers on Ask. claude-haiku-5-5 is the cheapest and fastest. For better
      # answers write claude-sonnet-5-5 (about 20 times the cost) or claude-opus-5-5 (about 40 times).
      SPENDLY_ASK_MODEL: claude-haiku-5-5
      # Optional: how many files (spreadsheets, documents, PDF and CSV) Ask can make for each account
      # each day. The owner has no limit. 0 makes none.
      # SPENDLY_ASK_FILES_PER_DAY: 10
      # Sends the emails that confirm an address and reset a forgotten password, and shows
      # "Forgot it?" on the sign-in page. Email stays off until the password below is set.
      # For Gmail: turn on 2-Step Verification for the Google account, make an app password at
      # https://myaccount.google.com/apppasswords, and write it without its spaces. After a
      # restart, the container log says whether Spendly could sign in to Gmail.
      SPENDLY_SMTP_HOST: smtp.gmail.com
      SPENDLY_SMTP_USER: offtopic74@gmail.com
      # SPENDLY_SMTP_PASSWORD: abcdefghijklmnop
      # Only for a mail server that does not use port 465. Gmail does not need it.
      # SPENDLY_SMTP_PORT: 587
      # The address you open Spendly at. The links in emails point here, so email stays off
      # without it. Use the same name as caddy's --from below.
      SPENDLY_PUBLIC_URL: "https://spendly.qnap.roob.dk"
      # The address in /.well-known/security.txt, where people report a security problem. It is
      # public: anyone on the internet can read it. Without this line there is no such file.
      SPENDLY_SECURITY_CONTACT: offtopic74@gmail.com
      # Lets Settings > This build install a newer version with "Update and reload": the app asks
      # the watchtower service below to do it. The token must match WATCHTOWER_HTTP_API_TOKEN.
      SPENDLY_UPDATER_URL: "http://watchtower:8080/v1/update"
      # Change it here and in WATCHTOWER_HTTP_API_TOKEN to the same long random text.
      SPENDLY_UPDATER_TOKEN: "change-this-demo-key"
      # Only this account may use "Update and reload". Without it, the first account made on this server may.
      # SPENDLY_OWNER_EMAIL: you@example.com
    volumes:
      # Absolute path -- a relative one breaks if this file moves. On QNAP: /share/Container/spendly:/data
      - /share/Container/spendly:/data
      # The files Ask makes. On QNAP: /share/Container/spendly-storage:/storage
      - /share/Container/spendly-storage:/storage
      # The log files. On QNAP: /share/Container/spendly-logs:/logs
      - /share/Container/spendly-logs:/logs

  # HTTPS in front of the app: browsers only use HTTP/2 and HTTP/3 over HTTPS, so this one
  # service turns both on. Caddy signs the certificate itself, which works with no internet
  # access; a device trusts it once the file caddy/pki/authorities/local/root.crt from the
  # mounted folder is installed on that device.
  caddy:
    image: caddy:2
    container_name: spendly-caddy
    restart: unless-stopped
    # The DNS name that points at the NAS, the same as SPENDLY_PUBLIC_URL above. The certificate
    # is issued for that exact name, so the https:// address must use it, not the IP.
    command: caddy reverse-proxy --from spendly.qnap.roob.dk --to spendly:4000 --internal-certs
    ports:
      # QTS holds port 443 for its own admin page by default -- free it first (Control Panel
      # > System > General Settings > System Administration, change the HTTPS port). To leave
      # QTS alone instead: write the --from address as spendly.qnap.roob.dk:8443 and make all
      # four numbers below 8443 -- the port must match end to end or HTTP/3 silently stops.
      # The udp line is HTTP/3; keep both lines.
      - "443:443"
      - "443:443/udp"
    volumes:
      # Keeps the signing certificate across container updates -- without it every update
      # makes a new one and every device must trust it again. Absolute path, like above.
      - /share/Container/spendly-caddy:/data

  # Auto-updates the spendly container when a new image lands on GHCR.
  watchtower:
    # nickfedor/watchtower is the maintained continuation, drop-in compatible;
    # containrrr/watchtower is archived and gets no fixes. Pinned to major version 1,
    # same style as caddy's 2: new releases yes, a surprise major jump no.
    image: nickfedor/watchtower:1
    container_name: watchtower
    restart: unless-stopped
    # No ports: spendly reaches the update API at http://watchtower:8080 inside Docker,
    # so nobody else on the network can call it.
    environment:
      TZ: "Europe/Copenhagen"
      # Enables the update API.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      # The same text as SPENDLY_UPDATER_TOKEN above.
      WATCHTOWER_HTTP_API_TOKEN: "change-this-demo-key"
      # Keeps the schedule below running alongside the API.
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    volumes:
      # Required for watchtower to see and repull images.
      - /var/run/docker.sock:/var/run/docker.sock
    # Every 15 min: pull, restart spendly if updated, clean up the old image.
    command: --schedule "0 */15 * * * *" --cleanup spendly
