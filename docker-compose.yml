# Spendly for a home server (written for QNAP Container Station, works anywhere Docker does).
# The bind mount is the database: back that folder up and you have backed the app up.

services:
  spendly:
    # Build locally, or swap these two lines for the CI-built image from GHCR
    # (docker login ghcr.io first if the repo is private):
    image: ghcr.io/mm98/spendly:latest
    #   build: .
    # A local build stamps no build time or commit into Settings > This build unless told:
    #   docker compose build --build-arg BUILD_TIME=$(date -u +%FT%TZ) --build-arg GIT_SHA=$(git rev-parse HEAD)
    container_name: spendly
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      SPENDLY_DB: /data/spendly.sqlite3
      # Sessions over plain http (LAN access by IP). Remove this line if you put the app
      # behind HTTPS (reverse proxy, Tailscale serve), so the cookie goes back to Secure.
      SPENDLY_PLAIN_HTTP: "1"
      # The bundle ships a source map beside every chunk, so a stack trace off this container
      # names a file in src/ rather than index-<hash>.js:1:24817. They are in the image either
      # way and cost no page load -- a browser fetches one only with devtools open -- but while
      # they are served, anyone who can reach this app can read its sources. Uncomment to hand
      # them out; it is a serving decision, so it takes a restart and not a rebuild:
      # SPENDLY_SOURCE_MAPS: "1"
      # Optional: lets Scan actually read a dropped receipt (vendor, date, line items, totals)
      # instead of only storing it for you to fill in by hand. Get a key at
      # https://console.anthropic.com/ -- Scan works either way, just without the reading.
      # ANTHROPIC_API_KEY: sk-ant-...
    volumes:
      # Absolute path, deliberately -- a relative one (./data) resolves against wherever this
      # file itself happens to sit, so moving or re-fetching docker-compose.yaml silently points
      # the app at a fresh, empty directory instead of the real data. An absolute path can't drift
      # like that. On QNAP, prefer an absolute path on a real share the same way, e.g. /share/Container/spendly:/data
      - /share/Container/spendly:/data

  # Watches the spendly container and repulls it from GHCR when a new image is pushed --
  # what turns `image: ghcr.io/mm98/spendly:latest` above into an app that actually updates
  # itself. Not needed for a local `build: .` setup, where there is no registry to poll.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    ports:
      # Exposes the HTTP API below so an update can also be triggered on demand (see the
      # WATCHTOWER_HTTP_API_UPDATE line), rather than only on the --schedule below.
      - "8085:8080"
    environment:
      TZ: "Europe/Copenhagen"
      # Turns on the HTTP endpoint (POST /v1/update) that lets an update be requested
      # immediately instead of waiting for the next scheduled poll.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      # Bearer token the HTTP API above requires. Change this before exposing port 8085
      # beyond the LAN -- anyone holding it can trigger an update on demand.
      WATCHTOWER_HTTP_API_TOKEN: "sp-9f3kX2mQv8LzT4wRb6Nd"
      # Keeps the --schedule below running on its own timer even though the HTTP API is on;
      # without this, enabling the API turns off the periodic poll entirely.
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    volumes:
      # Lets watchtower see and repull other containers' images -- this is how it works,
      # not a mount to change.
      - /var/run/docker.sock:/var/run/docker.sock
    # Polls every 15 minutes and, after pulling a newer image, restarts spendly and removes
    # the stale image it replaced. Scoped to the one container by name, so watchtower does
    # not also update itself.
    command: --schedule "0 */15 * * * *" --cleanup spendly
